name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            alias: x86_64
            qemu: ""
          - target: i686-unknown-linux-gnu
            alias: x86
            qemu: qemu-i386-static
          - target: aarch64-unknown-linux-gnu
            alias: arm64
            linker: gcc-aarch64-linux-gnu
            qemu: qemu-aarch64-static
          - target: arm-unknown-linux-gnueabihf
            alias: arm
            linker: gcc-arm-linux-gnueabihf
            qemu: qemu-arm-static
          - target: riscv64gc-unknown-linux-gnu
            alias: riscv64
            linker: gcc-riscv64-linux-gnu
            qemu: qemu-riscv64-static
          - target: powerpc64le-unknown-linux-gnu
            alias: ppc64le
            linker: gcc-powerpc64le-linux-gnu
            qemu: qemu-ppc64le-static
          - target: mipsel-unknown-linux-gnu
            alias: mipsel
            linker: gcc-mipsel-linux-gnu
            qemu: qemu-mipsel-static

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src

      - name: Install cross-linker
        if: matrix.linker
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.linker }}

      - name: Install QEMU
        if: matrix.qemu
        run: sudo apt-get update && sudo apt-get install -y qemu-user-static

      # Same script as local builds: size flags, per-target features,
      # .comment strip. Keeps CI artifacts identical to what build.sh makes.
      - name: Build release binary
        run: TARGET=${{ matrix.target }} ./build.sh

      - name: Check binary
        run: |
          file target/${{ matrix.target }}/release/kv
          ls -lh target/${{ matrix.target }}/release/kv

      - name: Run unit tests (native)
        if: matrix.qemu == ''
        run: ./scripts/unit-test.sh

      - name: Run integration tests (native)
        if: matrix.qemu == ''
        run: KV=target/${{ matrix.target }}/release/kv ./scripts/test.sh

      - name: Run smoke test (QEMU)
        if: matrix.qemu
        # All QEMU lines use || true because QEMU user-mode has known bugs
        # (e.g. PPC64 argv corruption in QEMU 10.x). Build+link is the real test.
        run: |
          ${{ matrix.qemu }} target/${{ matrix.target }}/release/kv --version || true
          ${{ matrix.qemu }} target/${{ matrix.target }}/release/kv cpu || true
          ${{ matrix.qemu }} target/${{ matrix.target }}/release/kv mem -j || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kv-${{ matrix.alias }}
          path: target/${{ matrix.target }}/release/kv

      # Static-PIE variant must keep building and running (x86_64 only in CI.
      # origin cannot do PIC startup on i686/mipsel, and QEMU legs are
      # skipped to keep CI time sane). Runs after upload so the artifact stays the
      # default non-PIE build.
      - name: Build and smoke test static-PIE variant
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          TARGET=${{ matrix.target }} ./build.sh --pie
          readelf -hW target/${{ matrix.target }}/release/kv | grep -q 'DYN'
          KV=target/${{ matrix.target }}/release/kv ./scripts/test.sh
